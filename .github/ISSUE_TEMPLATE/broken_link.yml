name: Report a Broken Download Link
description: Report a dead vendor CDN endpoint, TLS failure, or SHA-256 hash drift.
title: "[Broken Link]: "
labels: ["broken-link"]
body:
  - type: input
    id: vendor_entry
    attributes:
      label: Vendor / Entry ID
      description: The vendor name or `id` from `data/vendors/*.json`.
      placeholder: "e.g., avast-clear or Avast"
    validations:
      required: true
  - type: input
    id: dead_url
    attributes:
      label: Failing Download URL
      placeholder: "https://..."
    validations:
      required: true
  - type: dropdown
    id: failure_type
    attributes:
      label: Failure Type
      options:
        - HTTP 404 / Dead Endpoint
        - HTTP 403 / CDN Access Blocked
        - TLS / Certificate Error
        - Redirects to Generic Landing Page (Not Direct Binary)
        - SHA-256 Checksum Drift
    validations:
      required: true
  - type: input
    id: replacement_url
    attributes:
      label: Replacement Official Download URL (if known)
      placeholder: "https://..."
    validations:
      required: false
  - type: textarea
    id: details
    attributes:
      label: Additional Context
      placeholder: Paste HTTP status codes, curl/Invoke-WebRequest output, or updated vendor KB article links.
