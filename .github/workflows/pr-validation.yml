name: PR Validation
on:
  pull_request:
    paths:
      - 'data/**'
      - 'scripts/**'
      - 'tests/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install jsonschema requests pytest

      - name: Validate JSON Schema
        run: python scripts/validate-schema.py

      - name: Run Payload Tests
        run: pytest -q

      - name: Test Changed URLs
        run: python scripts/check-links.py --changed-only
